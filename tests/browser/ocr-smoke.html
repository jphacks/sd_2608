<!doctype html>
<html lang="ja"><meta charset="UTF-8"><title>ローカル OCR テスト</title>
<h1>ローカル OCR テスト</h1><p>テスト画像だけを認識します。デスクトップの撮影・AI 送信は行いません。</p>
<pre id="result" role="status">loading</pre><canvas width="900" height="180"></canvas>
<script type="module">
import { recognizeWindow } from "/src/adapters/ocr/recognizeWindow.ts";
const canvas = document.querySelector("canvas"), context = canvas.getContext("2d");
context.fillStyle = "white"; context.fillRect(0, 0, 900, 180);
context.fillStyle = "black"; context.font = "bold 64px Arial";
context.fillText("HELLO WORLD 2026", 30, 105);
try {
 const text = await recognizeWindow(canvas.toDataURL("image/png"), new AbortController().signal);
 const pass = /HELLO/.test(text) && /2026/.test(text);
 document.querySelector("#result").textContent = JSON.stringify({result: pass ? "PASS" : "FAIL", text, localAssets: true, desktopCaptured: false, aiCalled: false});
} catch { document.querySelector("#result").textContent = "FAIL: local OCR unavailable"; }
</script></html>
