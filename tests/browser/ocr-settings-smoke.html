<!doctype html>
<html lang="ja"><meta charset="UTF-8"><title>OCR 設定の表示テスト</title>
<h1>OCR 設定の表示テスト</h1><pre id="result" role="status">loading</pre><div id="app"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { SettingsPanel } from "/src/components/SettingsPanel.tsx";
import { createSnapshot } from "/src/contracts/fixtures.ts";
const output = document.querySelector("#result"), root = createRoot(document.querySelector("#app"));
const checks = [];
let settings = createSnapshot().settings;
const render = () => root.render(React.createElement(SettingsPanel, {settings, disabled: false, onSave: async request => {
  settings = { ...settings, ...request.values, revision: settings.revision + 1 };
  render();
} }));
const paint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
const check = (value, label) => { if (!value) throw Error(label); checks.push(label); };
try {
 render(); await paint();
 const toggle = document.querySelector('input[name="ocrEnabled"]');
 check(toggle && !toggle.checked, "初期値はオフ");
 check(document.querySelectorAll('[name^="ocr"]').length === 1, "OCR の設定はオン／オフ1項目だけ");
 toggle.click(); document.querySelector('button[type="submit"]').click(); await paint();
 check(settings.ocrEnabled === true, "オンを保存");
 toggle.click(); document.querySelector('button[type="submit"]').click(); await paint();
 check(settings.ocrEnabled === false, "オフを保存");
 output.textContent = JSON.stringify({result: "PASS", checks});
} catch (error) { output.textContent = `FAIL: ${error.message}`; }
</script></html>
